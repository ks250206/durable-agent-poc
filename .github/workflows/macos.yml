name: macOS native app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select installed macOS 27.2 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.2.app/Contents/Developer ]; then
            developer=/Applications/Xcode_27.2.app/Contents/Developer
          elif [ -d /Library/Developer/CommandLineTools ]; then
            developer=/Library/Developer/CommandLineTools
          else
            echo '::error::Xcode 27.2 or CLT 27.2 is required by pinned PiDurableKit'
            exit 1
          fi
          export DEVELOPER_DIR="$developer"
          export PATH="$developer/usr/bin:$PATH"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.2
          swift --version
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          echo "$developer/usr/bin" >> "$GITHUB_PATH"
      - name: Build
        run: swift build --build-system swiftbuild
      - name: Test including native AppKit and full hosting composition
        shell: bash
        env:
          CHAT_UI_ARTIFACTS_DIR: ${{ runner.temp }}/native-artifacts
        run: |
          set -euo pipefail
          plugin="$DEVELOPER_DIR/usr/lib/swift/host/plugins/testing"
          if [ ! -d "$plugin" ]; then
            plugin="$(xcrun --find swiftc)"
            plugin="$(dirname "$plugin")/../lib/swift/host/plugins/testing"
          fi
          test -d "$plugin"
          # Native windows/IME synthetic tests are required; no headless skip or weaker replacement.
          swift test -Xswiftc -plugin-path -Xswiftc "$plugin"
      - name: Package and verify local development signature
        run: scripts/build-app.sh
      - name: Archive app with resource bundles and signature intact
        run: ditto -c -k --sequesterRsrc --keepParent dist/DurableChat.app dist/DurableChat-macOS.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: DurableChat-native
          path: |
            dist/DurableChat-macOS.zip
            ${{ runner.temp }}/native-artifacts/
          if-no-files-found: warn
          retention-days: 7
